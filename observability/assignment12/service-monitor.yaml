apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: devopsapp
  namespace: team-payments
  labels:
    release: kube-prometheus    # ← must match what the operator looks for
spec:
  selector:
    matchLabels:
      app: devopsapp            # ← matches your Service's label
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
  namespaceSelector:
    matchNames:
      - team-payments