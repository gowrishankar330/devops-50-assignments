apiVersion: apps/v1
kind: Deployment
metadata:
  name: devopsapp
  namespace: default
spec:
  replicas: 3
  progressDeadlineSeconds: 60
  selector:
    matchLabels:
      app: devopsapp
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0          # ← never kill old pods until new ones are ready
      maxSurge: 1
  template:
    metadata:
      labels:
        app: devopsapp
    spec:
      containers:
        - name: devopsapp
          image: ghcr.io/gowrishankar330/devops-50-assignments/devopsapp:6c0bd746a0166c4dfe69d8bf23a51dad497cebc8
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
